<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Sesión</title>

    <link rel="stylesheet" href="../css/stylesConfiguracion.css">

    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js"></script>

</head>

<body>

    <header>
        <h1 data-i18n="tituloConfiguracion">Configuración de Sesión</h1>
    </header>

    <main>

        <section>
            <div>
                <p data-i18n="descripcionConfiguracion">
                    En esta sección, puedes configurar tus preferencias de sesión,
                    como el idioma, la privacidad y las notificaciones.
                </p>
            </div>
        </section>

        <section>
            <div>
                <h2 data-i18n="preferenciasSesion">Preferencias de Sesión</h2>

                <form action="../html/ConfiguracionSesion.html">

                    <label class="label-idioma" data-i18n="idioma">Idioma:</label>
                    <select name="idioma" id="idioma">
                        <option value="es" data-i18n="español">ESPAÑOL</option>
                        <option value="en" data-i18n="inglés">INGLÉS</option>
                        <option value="it" data-i18n="italiano">ITALIANO</option>
                        <option value="ja" data-i18n="japonés">JAPONES</option>
                    </select>
                    <label for="privacy" data-i18n="privacidad">Privacidad:</label>
                    <select id="privacy" name="privacy">
                        <option value="public" data-i18n="publico">Público</option>
                        <option value="private" data-i18n="privado">Privado</option>
                    </select>

                    <label for="notifications" data-i18n="notificaciones">Notificaciones:</label>
                    <select id="notifications" name="notifications">
                        <option value="enabled" data-i18n="habilitadas">Habilitadas</option>
                        <option value="disabled" data-i18n="deshabilitadas">Deshabilitadas</option>
                    </select>

                    <button type="submit" data-i18n="guardarConfiguracion">
                        Guardar Configuración
                    </button>

                </form>
            </div>
        </section>

        <section id="section-contact">

            <h3 class="title" data-i18n="comentarios">Comentarios / Sugerencias</h3>

            <form class="form-message" action="../html/ConfiguracionSesion.html">

                <!-- Formulario de comentarios/sugerencias 
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

            -->

                <div class="form-group">
                    <label for="mensaje" data-i18n="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Lorem ipsum, dolor sit amet consectetur adipisicing elit." rows="5" required></textarea>
                </div>

                <button data-i18n="enviar"></button>

            </form>

        </section>

    </main>

    <footer>
        <div>
            <a href="../index.html" data-i18n="volver_menu">⬅ Volver al menú</a>
        </div>

        <div>
            <p>Copyright © 2026 Triada. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../js/Idiomas.js"></script>
</body>

</html>
