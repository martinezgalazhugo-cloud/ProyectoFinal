<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Sesión</title>

    <link rel="stylesheet" href="../css/stylesConfiguracion.css">
</head>

<body>

    <header>
        <h1>Configuración de Sesión</h1>
    </header>

    <main>

        <section>
            <div>
                <p>
                    En esta sección, puedes configurar tus preferencias de sesión,
                    como el idioma, la privacidad y las notificaciones.
                </p>
            </div>
        </section>

        <section>
            <div>
                <h2>Preferencias de Sesión</h2>

                <form action="../html/ConfiguracionSesion.html">

                    <label for="language">Idioma:</label>
                    <select id="language" name="language">
                        <option value="es">Español</option>
                        <option value="en">Inglés</option>
                        <option value="it">Italiano</option>
                        <option value="jp">Japonés</option>
                    </select>
                    <label for="privacy">Privacidad:</label>
                    <select id="privacy" name="privacy">
                        <option value="public">Público</option>
                        <option value="private">Privado</option>
                    </select>

                    <label for="notifications">Notificaciones:</label>
                    <select id="notifications" name="notifications">
                        <option value="enabled">Habilitadas</option>
                        <option value="disabled">Deshabilitadas</option>
                    </select>

                    <button type="submit">
                        Guardar Configuración
                    </button>

                </form>
            </div>
        </section>

        <section id="section-contact">

            <h3 class="title">Comentarios / Sugerencias</h3>

            <form class="form-message" action="../html/ConfiguracionSesion.html">

                <!-- Formulario de comentarios/sugerencias 
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

            -->

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" rows="5" required></textarea>
                </div>

                <input class="btn-send-msg" type="submit" value="Enviar">

            </form>

        </section>

    </main>

    <footer>
        <div>
            <a href="../index.html">⬅ Volver al menú</a>
        </div>

        <div>
            <p>Copyright © 2026 Triada. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
