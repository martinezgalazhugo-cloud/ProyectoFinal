<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <!-- Conecta el HTML con los estilos definidos para la página de sesión -->
  <link rel="stylesheet" href="../css/stylesSesion.css">
  <script src="../js/CuentaPrueba.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js"></script>
</head>

<body>
  <!-- Encabezado principal de la página -->
  <header>
    <h1 data-i18n="iniciarSesion">Iniciar sesión</h1>
    <p data-i18n="descripcionSesion">Ingresa tus credenciales para continuar.</p>

    <label class="label-idioma" data-i18n="idioma">Idioma:</label>
    <select name="idioma" id="idioma">
      <option value="es" data-i18n="español">ESPAÑOL</option>
      <option value="en" data-i18n="inglés">INGLÉS</option>
      <option value="it" data-i18n="italiano">ITALIANO</option>
      <option value="ja" data-i18n="japonés">JAPONES</option>
    </select>

  </header>

  <main>
    <section id="section-login">
      <div class="login-card">
        <!-- Contenedor visual principal del formulario -->
        <form action="#" method="post" id="login-form">
          <!-- Grupo de campo para el usuario -->
          <div class="form-group">
            <label for="username" data-i18n="usuario">Usuario</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>

          <!-- Grupo de campo para la contraseña -->
          <div class="form-group">
            <label for="password" data-i18n="contraseña">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>

          <!-- Botón de enviar el formulario -->
          <button type="submit" class="btn-login" data-i18n="botonSesion">Iniciar sesión</button>
        </form>

        <!-- Enlace de navegación para crear una cuenta nueva -->
        <p class="account-text">
          <a href="CrearSesion.html" data-i18n="crearsesion">Crear una cuenta</a>
        </p>

        <p class="account-text">
          <a href="../index.html" data-i18n="regresar">Regresar</a>
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>Copyright © 2026 Triada. Todos los derechos reservados.</p>
  </footer>

  <script src="../js/Idiomas.js"></script>
</body>

</html>
